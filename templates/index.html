<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Insight Master</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
  <!-- Custom styles for loading spinner and navigation -->
  <style>
    /* Full-screen overlay for loading */
    #loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.8);
      z-index: 9999;
      text-align: center;
      padding-top: 20%;
    }
    /* Custom spinner */
    .spinner {
      width: 80px;
      height: 80px;
      border: 12px solid #f3f3f3;
      border-top: 12px solid #3498db;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      margin: auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loading-overlay p {
      font-size: 1.2em;
      color: #333;
      margin-top: 20px;
    }
    /* Navigation styles for the relocated nav area */
    #page-nav {
      margin-top: 20px;
      text-align: right;
    }
    #page-nav a {
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <!-- Header with title only -->
  <header class="mb-4">
    <h1>Excel Insight Master</h1>
  </header>

  <div class="container">
    <!-- Upload Section -->
    <section id="upload-section">
      <h2>Upload Excel File</h2>
      <form id="upload-form" enctype="multipart/form-data">
        <label for="file-input" class="upload-label">Select File</label>
        <input type="file" name="file" id="file-input" required style="display:none;">
        <button type="submit" class="btn btn-primary">Upload File</button>
      </form>
      <!-- Display available columns after upload -->
      <div id="columns-list" class="mt-3"></div>
    </section>
    
    <!-- Navigation Section relocated below file upload -->
    <div id="page-nav">
      <a href="/dashboard/" class="btn btn-secondary">Graph &amp; Chart</a>
      <a href="/insights" class="btn btn-secondary">File Insights</a>
    </div>
    
    <!-- Combined Query and Summarization Section -->
    <section id="query-section" class="mt-4">
      <h2>Enter Your Query or Text</h2>
      <textarea id="query-input" class="form-control" placeholder="Enter your query or text for summarization..." rows="4"></textarea>
      <label for="sort-order" class="mt-2">Sort Order:</label>
      <select id="sort-order" class="form-control mb-3">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
      </select>
      <button id="query-btn" class="btn btn-success mt-3">Submit</button>
      <!-- Results will be displayed below -->
      <div id="summary-result" class="mt-3"></div>
      <div id="query-result" class="mt-3"></div>
      <p class="mt-3 text-muted">To generate graphs—including those based on your query results—please visit the <strong>Graph &amp; Chart</strong> section.</p>
    </section>
    
    <!-- File Insights Section is loaded via the Insights button -->
    <div id="file-insights" class="mt-3"></div>
  </div>

  <!-- Loading Spinner Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Processing, please wait...</p>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- JavaScript for Interactivity -->
  <script>
    function showLoading() {
      $('#loading-overlay').show();
    }
    function hideLoading() {
      $('#loading-overlay').hide();
    }
    
    // Handle file upload and populate available columns
    $('#upload-form').on('submit', function(event) {
      event.preventDefault();
      showLoading();
      let formData = new FormData();
      formData.append("file", $('#file-input')[0].files[0]);
      $.ajax({
        url: '/upload',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(response) {
          hideLoading();
          alert(response.message);
          let columnsHtml = "<h3>Available Columns:</h3><ul>";
          response.columns.forEach(function(col) {
            columnsHtml += "<li>" + col + "</li>";
          });
          columnsHtml += "</ul>";
          $('#columns-list').html(columnsHtml);
        },
        error: function() {
          hideLoading();
          alert('Error uploading file');
        }
      });
    });
    
    // Handle "Get File Insights" button click
    $('#insights-btn').on('click', function() {
      showLoading();
      $.ajax({
        url: '/insights',
        type: 'GET',
        success: function(response) {
          hideLoading();
          $('#file-insights').html(response);
        },
        error: function() {
          hideLoading();
          alert('Error retrieving file insights.');
        }
      });
    });
    
    // Handle combined query and summarization submission
    $('#query-btn').on('click', function() {
      let query = $('#query-input').val();
      let sortOrder = $('#sort-order').val();
      if (query.trim() === '') {
        alert('Please enter a query or text.');
        return;
      }
      showLoading();
      $.ajax({
        url: '/query',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ query: query, sort_order: sortOrder }),
        success: function(response) {
          if (!response.results || response.results.length === 0) {
            $('#query-result').html('<strong>No query results found.</strong>');
          } else {
            let table = '<table class="table table-bordered"><thead><tr>';
            Object.keys(response.results[0]).forEach(function(col) {
              table += '<th>' + col + '</th>';
            });
            table += '</tr></thead><tbody>';
            response.results.forEach(function(row) {
              table += '<tr>';
              Object.values(row).forEach(function(value) {
                table += '<td>' + value + '</td>';
              });
              table += '</tr>';
            });
            table += '</tbody></table>';
            $('#query-result').html(table);
          }
        },
        error: function() {
          $('#query-result').html('<strong>Error processing query.</strong>');
        },
        complete: function() {
          hideLoading();
        }
      });
      $.ajax({
        url: '/summarize',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ text: query }),
        success: function(response) {
          $('#summary-result').html('<strong>Summary:</strong> ' + response.summary);
        },
        error: function() {
          $('#summary-result').html('<strong>Error generating summary.</strong>');
        }
      });
    });
    
    window.addEventListener('scroll', function () {
      if (window.scrollY > 50) {
        document.body.classList.add('scroll-shrink');
      } else {
        document.body.classList.remove('scroll-shrink');
      }
    });
    
    function revealSections() {
      const sections = document.querySelectorAll("section");
      sections.forEach((section) => {
        const sectionTop = section.getBoundingClientRect().top;
        if (sectionTop < window.innerHeight - 100) {
          section.classList.add("show");
        }
      });
    }
    
    window.addEventListener("scroll", revealSections);
    window.addEventListener("load", revealSections);
  </script>
</body>
</html>
